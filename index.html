<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>周末有方 · 大学生城市探索指南</title>
<meta name="description" content="打开就有这周末能直接出发的方案，转发到群里就能定下来。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <!-- 桌面端：设计说明 -->
  <aside class="about" id="aboutPanel"></aside>

  <div class="phone">
    <div id="app">
      <header>
        <h1>周末有方<small>大学生的城市探索指南</small></h1>
        <div class="row nowrap"><select id="city"></select><button class="icon-btn" onclick="openAbout()" title="设计说明">ⓘ</button></div>
      </header>

      <!-- ① 方案 -->
      <section class="view" id="v-plan">
        <div class="weather" id="wx"></div>
        <div class="cond" id="cond" onclick="openCond()"></div>
        <div class="headline" id="headline"></div>
        <div id="plans"></div>
        <div class="card">
          <div class="sec-title"><span>📚 活动库</span><span class="meta">聚合自 豆瓣同城 / 大麦 / 小红书 / 公众号</span></div>
          <div class="chips" id="libtypes"></div>
          <div id="lib"></div>
        </div>
      </section>

      <!-- ② 组局 -->
      <section class="view" id="v-team">
        <div class="card hero">
          <h3>👥 组局：群里不用再说“都行”</h3>
          <p>每人 10 秒填偏好 → 自动合并时间、预算、兴趣和否决项 → 生成全员都能接受的方案</p>
          <div class="row nowrap" style="margin-top:10px">
            <input id="joinCode" placeholder="输入邀请码加入，如 WK-8K2Q" style="flex:1;border:0">
            <button class="btn" id="joinBtn">加入</button>
          </div>
        </div>
        <div id="teams"></div>
      </section>

      <!-- ③ 足迹 -->
      <section class="view" id="v-checkin">
        <div id="active"></div>
        <div class="card">
          <div class="sec-title"><span>🪪 城市护照</span><button class="btn sm ghost" id="newCheck">+ 手动打卡</button></div>
          <div class="stats" id="stats"></div>
          <div class="passport" id="passport"></div>
          <div class="badges" id="badges"></div>
        </div>
        <div class="card">
          <div class="sec-title">📍 打卡记录</div>
          <div class="timeline" id="timeline"></div>
        </div>
      </section>

      <!-- ④ 攻略 -->
      <section class="view" id="v-guide">
        <div class="card hero">
          <h3>📝 一键生成我的周末攻略</h3>
          <p>根据你的打卡自动整理路线、花费和评价；发布后同城同学可以一键套用</p>
          <button class="btn" style="margin-top:10px;background:#fff;color:var(--pri)" id="genGuide">生成攻略</button>
        </div>
        <div class="sec-title"><span>🔥 <span id="gcity"></span>同学的攻略</span><div class="seg" id="gsort"><button data-g="hot" class="on">最热</button><button data-g="new">最新</button></div></div>
        <div id="guides"></div>
      </section>
      <p class="note">活动与天气为演示数据 · 数据仅保存在你的浏览器</p>
    </div>

    <nav>
      <a href="#plan" data-v="plan"><i>🧭</i>方案</a>
      <a href="#team" data-v="team"><i>👥</i>组局</a>
      <a href="#checkin" data-v="checkin"><i>📍</i>足迹</a>
      <a href="#guide" data-v="guide"><i>📝</i>攻略</a>
    </nav>
    <div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
    <div class="toast" id="toast"></div>
    <div class="stampfx" id="stampfx"></div>
  </div>
</div>

<template id="aboutTpl">
  <div class="about-in">
    <div class="brand">周末有方</div>
    <p class="claim">打开就有这周末能直接出发的方案，<br>转发到群里就能定下来。</p>
    <div class="about-sec">
      <h4>30 秒体验</h4>
      <ol class="steps">
        <li onclick="go('plan');setTimeout(()=>openPlan(0),80)"><b>① 看方案</b><span>天气、预算、人数 → 3 套可执行的路线</span></li>
        <li onclick="closeSheet();go('team')"><b>② 组局合并</b><span>室友已填好偏好，填上你的，看系统怎么合并</span></li>
        <li onclick="closeSheet();go('checkin')"><b>③ 打卡 → 攻略</b><span>按站盖章，一键生成可被套用的攻略</span></li>
      </ol>
    </div>
    <div class="about-sec">
      <h4>痛点 → 设计</h4>
      <table class="pain">
        <tr><td>刷一小时还是不知道去哪</td><td>直接给<b>行程方案</b>，不给活动列表</td></tr>
        <tr><td>天气突变、预算算不清</td><td>分时段天气 + <b>雨天备选</b>；花费含交通餐饮</td></tr>
        <tr><td>群里都说“随便”</td><td><b>偏好合并</b>：时间取交集、预算取最低、一票否决</td></tr>
        <tr><td>玩完没沉淀</td><td>按站<b>盖章</b>，自动成攻略，别人能一键套用</td></tr>
      </table>
    </div>
    <p class="about-note">活动、天气为演示数据；多人同步为本地演示，正式版接入后端与活动数据源。</p>
    <button class="btn ghost sm" onclick="resetDemo()">↺ 重置演示数据</button>
  </div>
</template>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script>document.getElementById('aboutPanel').innerHTML=document.getElementById('aboutTpl').innerHTML;</script>
<script src="js/app.js"></script>
</body>
</html>
